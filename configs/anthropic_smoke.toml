# First real run on Claude: 44 episodes per model (4 tasks x {benign + 2 attack styles x
# applicable goals} x {none, permissions}). Three tiers: Opus 5.5 (most capable),
# Sonnet 5.5 (the usual production agent model), Haiku 5.5 (high-volume, cheapest).
#
# 1. Put your key in a .env file in this folder (git-ignored; never paste keys into chat):
#      ANTHROPIC_API_KEY=...
# 2. Check the matrix, then run all models or pick some with --model (repeatable):
#      uv run injbench run configs/anthropic_smoke.toml --dry-run
#      uv run injbench run configs/anthropic_smoke.toml --model claude-sonnet-5-5 --model claude-haiku-5-5
#      uv run injbench run configs/anthropic_smoke.toml
#
# Rough cost estimate per model (not measured): Opus 5.5 about $2-6, Sonnet 5.5 about $1-3,
# Haiku 5.5 about $0.05-0.30. Thinking tokens bill as output. The budget cap stops new API
# calls once reached, and responses are cached in .cache/, so re-running costs nothing.
[run]
name = "anthropic-smoke"
world_seed = 0
instances_per_template = 1
templates = ["sla_summary_report", "triage_new_tickets", "kb_answer_comment", "close_confirmed"]
attack_families = ["info_block", "business_note"]
attack_goals = ["grant_admin", "falsify_count", "close_unrequested"]
defenses = ["none", "permissions"]
concurrency = 4
max_steps = 15
budget_usd = 12.0

# Prices: USD per 1M tokens from the Anthropic price list (checked 2026-11-18).
# Cache writes use the 5-minute TTL (1.25x input). Temperature is not sent: current Claude
# models reject non-default values. Effort is "medium" for all three: the default on Opus 5.5
# and Haiku 5.5, and the recommended starting point for multi-step tool use on Sonnet 5.5
# (whose default is "high"). Effort levels are calibrated per model, so equal labels do not
# mean equal thinking.
[[models]]
name = "claude-opus-5-5"
kind = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
price_in_per_m = 4.0
price_out_per_m = 20.0
price_cache_write_per_m = 5.0
price_cache_read_per_m = 0.20
extra_params = { output_config = { effort = "medium" } }

[[models]]
name = "claude-sonnet-5-5"
kind = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
price_in_per_m = 2.0
price_out_per_m = 10.0
price_cache_write_per_m = 2.50
price_cache_read_per_m = 0.10
extra_params = { output_config = { effort = "medium" } }

[[models]]
name = "claude-haiku-5-5"
kind = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
price_in_per_m = 0.10   # prompts up to 100K tokens; ours are far below
price_out_per_m = 0.50
price_cache_write_per_m = 0.125
price_cache_read_per_m = 0.01
extra_params = { output_config = { effort = "medium" } }
