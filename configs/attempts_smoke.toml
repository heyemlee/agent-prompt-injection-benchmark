# Offline repeated-attempts run (M4) with scripted reference agents. No API calls, no cost.
# Every attack case runs 3 times with paraphrased payloads (variant 0 is the canonical payload),
# and the summary gets an ASR@k table. See docs/attacks.md.
#   uv run injbench run configs/attempts_smoke.toml --dry-run
#   uv run injbench run configs/attempts_smoke.toml
[run]
name = "attempts-smoke"
world_seed = 0
instances_per_template = 1
templates = ["sla_summary_report", "triage_new_tickets", "kb_answer_comment", "close_confirmed"]
attack_families = ["override", "info_block", "fake_system", "business_note"]
attack_goals = ["exfil_email_phones", "grant_admin", "cross_team_report", "falsify_count",
                "close_unrequested"]
defenses = ["none", "permissions"]
attempts = 3
attempt_randomness = "paraphrase"   # or "temperature" for API models with temperature > 0
variant_seed = 0
concurrency = 8

# Follows the task and ignores every injection.
[[models]]
name = "ref-gold"
kind = "scripted"
behavior = "gold"

# Does the task and also everything the injection asks.
[[models]]
name = "ref-gullible"
kind = "scripted"
behavior = "gullible"
