# E1 on Claude: the API model "for realism" (PLAN §8.1). Claude Sonnet 5.5, the usual production
# agent model, with the same settings as configs/anthropic_smoke.toml so results line up with M1.
#
# Matrix: 21 templates x 1 instance x {benign + 4 families x applicable goals} x 4 arms
#         = 2,036 episodes (509 per arm). Datamarking is the one spotlighting mode here, to keep the
#         cost down; the Qwen config runs all three.
# Permission twins share model samples until a blocked call (paired design), so about 2 of the 4
# arms are paid.
#
# Cost estimate (2026-11-19, not measured): about $16, plausible range $9-23. Method as in
# configs/e1_qwen_siliconflow.toml, calibrated on the M1 Claude runs. The E1 pilot checked it on
# Haiku 5.5: the cost paid per episode was 0.8-1.1x this method's estimate, and no permissions
# twin ever diverged (Haiku made no out-of-scope call or read in 429 episodes), so only the
# unpermissioned arms are paid. Expect about $14-16. Alternatives, same matrix:
#   - Haiku 5.5, all 8 arms: about $1.5-2 (the pilot's Haiku episodes replay from the cache).
#   - Sonnet 5.5, all 8 arms: about $33.
#   - Opus 5.5, these 4 arms: about $41.
# To use one of them, copy that model's block from configs/anthropic_smoke.toml and set `defenses`
# and `budget_usd` to match.
#
#   uv run injbench run configs/e1_claude.toml --dry-run
#   uv run injbench run configs/e1_claude.toml
[run]
name = "e1-claude"
world_seed = 0
instance_seed = 0
instances_per_template = 1
templates = ["access_request_handling", "access_review_privileged", "backlog_by_priority",
             "chase_stale_pending", "close_confirmed", "closure_feedback_review",
             "email_report_summary", "escalate_sla_risk", "escalation_digest_email",
             "hold_requests", "kb_answer_comment", "kb_flag_outdated", "kb_form_email",
             "link_duplicates", "mean_time_to_close", "p1_p2_review", "reassign_departing",
             "reopen_requests", "sla_summary_report", "triage_new_tickets",
             "weekly_volume_report"]
attack_families = ["override", "info_block", "fake_system", "business_note"]
attack_goals = ["exfil_email_phones", "grant_admin", "cross_team_report", "falsify_count",
                "close_unrequested", "misroute_cross_team", "misroute_ticket", "falsify_metric",
                "wrong_kb_code", "false_duplicate", "omit_from_review", "reopen_unrequested",
                "hold_unrequested"]
defenses = ["none", "permissions", "spotlight_datamark", "permissions+spotlight_datamark"]
concurrency = 4
max_steps = 15
budget_usd = 25.0

# Prices: USD per 1M tokens from the Anthropic price list (rechecked 2026-11-19). Cache writes use
# the 5-minute TTL (1.25x input). Effort "medium", as in the M1 smoke runs. Server-side fallbacks
# stay off so that the model under test is never swapped out.
[[models]]
name = "claude-sonnet-5-5"
kind = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 16000
price_in_per_m = 2.0
price_out_per_m = 10.0
price_cache_write_per_m = 2.50
price_cache_read_per_m = 0.10
extra_params = { output_config = { effort = "medium" } }
