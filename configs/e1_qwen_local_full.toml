# Full E1 on the local Qwen: all 4 families, 2 instances per template (the matrix of
# e1_qwen_siliconflow.toml with the 4 arms of e1_qwen_local.toml). 4,072 episodes; the 1,060 of
# e1_qwen_local.toml replay from the cache.
# Arms and model block are those of e1_qwen_local.toml; its header says why base64 is left out.
# Took 10.5 hours on the M4 Max with E1 cached; results in the README.
#   uv run injbench run configs/e1_qwen_local_full.toml --dry-run
#   uv run injbench run configs/e1_qwen_local_full.toml
[run]
name = "e1-qwen-local-full"
world_seed = 0
instance_seed = 0
instances_per_template = 2
templates = ["access_request_handling", "access_review_privileged", "backlog_by_priority",
             "chase_stale_pending", "close_confirmed", "closure_feedback_review",
             "email_report_summary", "escalate_sla_risk", "escalation_digest_email",
             "hold_requests", "kb_answer_comment", "kb_flag_outdated", "kb_form_email",
             "link_duplicates", "mean_time_to_close", "p1_p2_review", "reassign_departing",
             "reopen_requests", "sla_summary_report", "triage_new_tickets",
             "weekly_volume_report"]
attack_families = ["override", "info_block", "fake_system", "business_note"]
attack_goals = ["exfil_email_phones", "grant_admin", "cross_team_report", "falsify_count",
                "close_unrequested", "misroute_cross_team", "misroute_ticket", "falsify_metric",
                "wrong_kb_code", "false_duplicate", "omit_from_review", "reopen_unrequested",
                "hold_unrequested"]
defenses = ["none", "permissions", "spotlight_datamark", "permissions+spotlight_datamark"]
concurrency = 4
max_steps = 15

# `model` names the exact weights. It is part of every cache key, so change it whenever the
# weights or the quantization change, and cached responses of two servers never mix.
[[models]]
name = "qwen3.5-9b-local"
kind = "openai_compat"
model = "unsloth/Qwen3.5-9B-GGUF:Q8_0"
base_url_env = "LOCAL_QWEN_BASE_URL"
api_key_env = "LOCAL_QWEN_API_KEY"
local = true          # costs $0: no price needed, and budget caps ignore it
timeout_s = 1200      # four slots on a laptop can need minutes for one long turn
max_retries = 2
temperature = 0.7

[models.extra_params]
max_tokens = 8192
top_p = 0.8

# Thinking off, as on SiliconFlow. Sampling follows Qwen's recommended non-thinking settings,
# because SiliconFlow does not document the defaults the pilot ran with; G0 checks the outcome.
[models.extra_params.extra_body]
top_k = 20
min_p = 0.0
chat_template_kwargs = { enable_thinking = false }
