# E2 on the local Qwen: what does an injection detector add, alone and on top of permissions?
# (PLAN §8.2)
# Only the 5 templates held out from detector training and calibration (the detector's test
# split; tests/test_config_guards.py keeps it that way), so no task the detector was tuned on is
# scored. Matrix: 5 test templates x 2 instances x {benign + 4 families x applicable goals}
#         x 4 arms = 904 episodes (226 per arm).
# Why a 2x2: the first E2 run (instance 0, permissions vs permissions+modernbert, 2026-11-19) hit
# a floor. Permissions alone let 1 of 108 attacks through, so the stacked arm had nothing left to
# show. The detector-only arm (`modernbert`) measures the detector where attacks still succeed.
# Threshold: artifacts/detect/calibration/modernbert.json, the pre-registered rule (1% FPR on the
# validation split, seed 0). Score on the same device as the first run:
# INJBENCH_DETECT_DEVICE=cpu.
# Arms share model samples until a redaction changes what the model sees. `none` and
# `permissions` replay from configs/e1_qwen_local_full.toml and instance 0 of
# `permissions+modernbert` from the first E2 run, so only the detector arms make new calls.
# Prompt Guard 2 is gated on Hugging Face. Once access is granted and HF_TOKEN is in .env:
#   uv run --extra detect injbench-detect calibrate --detector promptguard2
# then add "permissions+promptguard2" to `defenses`; the other arms replay from the cache.
#   uv run --extra detect injbench-detect check --load
#   uv run --extra detect injbench run configs/e2_detectors_qwen_local.toml
[run]
name = "e2-detectors-qwen-local"
world_seed = 0
instance_seed = 0
instances_per_template = 2
templates = ["access_request_handling", "chase_stale_pending", "kb_flag_outdated",
             "reassign_departing", "reopen_requests"]  # the detector's test split
attack_families = ["override", "info_block", "fake_system", "business_note"]
attack_goals = ["exfil_email_phones", "grant_admin", "cross_team_report", "falsify_count",
                "close_unrequested", "misroute_cross_team", "misroute_ticket", "falsify_metric",
                "wrong_kb_code", "false_duplicate", "omit_from_review", "reopen_unrequested",
                "hold_unrequested"]
defenses = ["none", "modernbert", "permissions", "permissions+modernbert"]
concurrency = 4
max_steps = 15

# `model` names the exact weights. It is part of every cache key, so change it whenever the
# weights or the quantization change, and cached responses of two servers never mix.
[[models]]
name = "qwen3.5-9b-local"
kind = "openai_compat"
model = "unsloth/Qwen3.5-9B-GGUF:Q8_0"
base_url_env = "LOCAL_QWEN_BASE_URL"
api_key_env = "LOCAL_QWEN_API_KEY"
local = true          # costs $0: no price needed, and budget caps ignore it
timeout_s = 1200      # four slots on a laptop can need minutes for one long turn
max_retries = 2
temperature = 0.7

[models.extra_params]
max_tokens = 8192
top_p = 0.8

# Thinking off, as on SiliconFlow. Sampling follows Qwen's recommended non-thinking settings,
# because SiliconFlow does not document the defaults the pilot ran with; G0 checks the outcome.
[models.extra_params.extra_body]
top_k = 20
min_p = 0.0
chat_template_kwargs = { enable_thinking = false }
