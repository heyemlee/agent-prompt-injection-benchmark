# E2: what does an injection detector add on top of permissions? (PLAN §8.2)
# Qwen3.5-9B on SiliconFlow, same model settings as configs/qwen_siliconflow.toml. Paid: not run
# in the M3 branch. Extend `templates` once the M2 templates are merged.
#
# Before running (docs/detector.md has the details):
# 1. uv sync --extra detect
# 2. Detector artifacts under artifacts/detect/ (or $INJBENCH_DETECT_DIR): the dataset, the
#    fine-tuned ModernBERT checkpoint, and a frozen threshold per detector:
#      uv run injbench-detect build-data
#      uv run injbench-detect train
#      uv run injbench-detect calibrate --detector modernbert
#      uv run injbench-detect calibrate --detector promptguard2   # gated: needs HF_TOKEN in .env
# 3. uv run injbench-detect check --load      # both arms calibrated and loadable
# 4. uv run --extra detect injbench run configs/e2_detectors_qwen_siliconflow.toml --dry-run
#    uv run --extra detect injbench run configs/e2_detectors_qwen_siliconflow.toml
#
# Arms share model samples until a redaction changes what the model sees (paired design), so
# differences between arms come from the detectors. The on-detect action is the same for both
# detector arms: each flagged tool-output segment is replaced by one fixed notice.
[run]
name = "e2-detectors-qwen-siliconflow"
world_seed = 0
instances_per_template = 1
templates = ["sla_summary_report", "triage_new_tickets", "kb_answer_comment", "close_confirmed"]
attack_families = ["info_block", "business_note"]
attack_goals = ["grant_admin", "falsify_count", "close_unrequested"]
defenses = ["permissions", "permissions+promptguard2", "permissions+modernbert"]
concurrency = 4
max_steps = 15
budget_usd = 3.0

[[models]]
name = "qwen3.5-9b-siliconflow"
kind = "openai_compat"
model = "Qwen/Qwen3.5-9B"
base_url = "https://api.siliconflow.com/v1"
api_key_env = "SILICONFLOW_API_KEY"
# USD per 1M tokens, international price list (2026-11-18).
price_in_per_m = 0.10
price_out_per_m = 0.15

[models.extra_params]
max_tokens = 8192

# Thinking off, as in configs/qwen_siliconflow.toml (SiliconFlow does not parse tool calls
# written inside the reasoning block).
[models.extra_params.extra_body]
enable_thinking = false
