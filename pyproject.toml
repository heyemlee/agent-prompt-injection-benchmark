[project]
name = "injbench"
version = "0.1.0"
description = "Prompt-injection benchmark and defenses for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=1.40",
]

[project.optional-dependencies]
# M3 injection detectors (ModernBERT fine-tune, Prompt Guard 2). Not needed for the core
# benchmark: `import injbench` never imports torch.
detect = [
    "torch>=2.4",
    "transformers>=4.48",
]

[project.scripts]
injbench = "injbench.cli:main"
injbench-detect = "injbench.detect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
