[project]
name = "injbench"
version = "0.1.0"
description = "Prompt-injection benchmark and defenses for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=1.40",
]

[project.optional-dependencies]
# UK AISI Inspect port (src/injbench/inspect_port, docs/inspect.md). Not needed by the core
# package or the default test run. Tested with inspect-ai 0.3.223 and 0.3.291.
inspect = [
    "inspect-ai>=0.3.223",
]

[project.scripts]
injbench = "injbench.cli:main"

# Lets `inspect eval injbench/injbench` find the task (loaded only by Inspect).
[project.entry-points.inspect_ai]
injbench = "injbench.inspect_port._registry"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/injbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
